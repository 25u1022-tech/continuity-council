  <rect x="408" y="525" width="76" height="18" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <text x="446" y="538" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">TLS direct</text>

