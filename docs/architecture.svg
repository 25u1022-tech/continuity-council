  <rect x="522" y="482" width="60" height="18" rx="4" fill="#ffffff" stroke="#e5e7eb" stroke-width="1" />
  <text x="552" y="495" text-anchor="middle" font-size="11" font-weight="600" fill="#059669">Live APIs</text>

