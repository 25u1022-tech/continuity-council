<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" width="100%" height="100%" style="background:#ffffff; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;">
  <defs>
