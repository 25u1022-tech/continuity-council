  <text x="348" y="130" text-anchor="middle" font-size="11" fill="#6b7280">Live Multi-Agent Monitor</text>

  <rect x="458" y="92" width="188" height="52" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
