  <text x="348" y="582" text-anchor="middle" font-size="13" font-weight="600" fill="#1e40af">Gemini 3.6-flash</text>
  <text x="348" y="600" text-anchor="middle" font-size="11" fill="#6b7280">Multimodal Vision &amp; Tools</text>

  <rect x="458" y="560" width="188" height="56" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
  <text x="552" y="582" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">Open-Meteo &amp; ECB</text>
  <text x="552" y="600" text-anchor="middle" font-size="11" fill="#6b7280">Weather Risk &amp; FX Rates</text>

  <rect x="662" y="560" width="188" height="56" rx="6" fill="#f0fdf4" stroke="#059669" stroke-width="1.5" />
  <text x="756" y="582" text-anchor="middle" font-size="13" font-weight="600" fill="#065f46">World Bank &amp; OSM</text>
