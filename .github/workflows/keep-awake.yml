name: Keep Cloud Run Warm
on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -f https://continuity-council-254080656276.us-central1.run.app/api/health || echo "Ping failed"
