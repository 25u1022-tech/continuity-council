name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Unit tests
        run: python -m pytest tests/test_units.py -q

  deploy-status:
    name: Production Deployment Status
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://continuity-council-254080656276.us-central1.run.app
    steps:
      - name: Check Cloud Run Deployment Health
        run: |
          curl -f -s -S https://continuity-council-254080656276.us-central1.run.app/api/health
          echo "Cloud Run deployment is live at https://continuity-council-254080656276.us-central1.run.app"
